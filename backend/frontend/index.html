<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Role Router | ARGO Property Management</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --sidebar: #0F172A;
            --canvas: #F8FAFC;
            --white: #FFFFFF;
            --border: #E2E8F0;
            --text: #1E293B;
            --muted: #64748B;
            --success: #059669;
            --danger: #E11D48;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--canvas);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }

        .auth-header {
            background: var(--sidebar);
            color: white;
            padding: 28px 24px;
            text-align: center;
            position: relative;
        }

        .brand-logo-large {
            width: 52px;
            height: 52px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: 0.2s ease;
        }

        .auth-header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .auth-header p {
            font-size: 12px;
            color: #94A3B8;
            letter-spacing: 0.5px;
        }

        /* BACKEND STATUS BADGE */
        .db-status-badge {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #CBD5E1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94A3B8;
        }

        .status-dot.online { background: #10B981; box-shadow: 0 0 8px #10B981; }
        .status-dot.offline { background: #F59E0B; }

        .auth-body {
            padding: 28px 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 16px;
        }

        .form-group input, .form-group select {
            width: 100%;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 14px 0 42px;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
            background: #F8FAFC;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .auth-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            cursor: pointer;
        }

        .auth-options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-options a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            height: 42px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-submit:hover { background: var(--primary-dark); }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .demo-roles {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .demo-btn {
            width: 100%;
            height: 38px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.15s;
        }

        .demo-btn:hover { background: #F1F5F9; border-color: #CBD5E1; }
        .demo-btn i { font-size: 14px; color: var(--primary); }

        .auth-footer {
            padding: 16px 24px;
            background: #F8FAFC;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 11px;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- HEADER -->
        <div class="auth-header">
            <div class="brand-logo-large" id="largeBrandLogo">A</div>
            <h1>ARGO Property Management</h1>
            <p id="authSubtitle">Auth Gateway & Role Router</p>
            
            <!-- PostgreSQL DB Connection Status -->
            <div class="db-status-badge">
                <span id="dbStatusDot" class="status-dot"></span>
                <span id="dbStatusText">Checking PostgreSQL connection...</span>
            </div>
        </div>

        <!-- AUTH TABS: SIGN IN vs REGISTER -->
        <div class="auth-tabs" style="display:flex; border-bottom:1px solid var(--border, #E2E8F0); margin-bottom:20px;">
            <button type="button" id="tabSignIn" class="tab-btn active" onclick="switchAuthMode('signin')" style="flex:1; padding:10px; font-weight:700; background:none; border:none; border-bottom:2px solid var(--primary, #2563EB); color:var(--primary, #2563EB); cursor:pointer;">
                Sign In
            </button>
            <button type="button" id="tabRegister" class="tab-btn" onclick="switchAuthMode('register')" style="flex:1; padding:10px; font-weight:700; background:none; border:none; border-bottom:2px solid transparent; color:var(--muted, #64748B); cursor:pointer;">
                Register New Account
            </button>
        </div>

        <!-- FORM BODY -->
        <div class="auth-body">
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                
                <!-- REGISTRATION ONLY: FULL NAME & PHONE -->
                <div id="registerFields" style="display:none;">
                    <div class="form-group">
                        <label>Full Legal Name <span style="color:var(--danger, #EF4444);">*</span></label>
                        <div class="input-with-icon">
                            <i class="bi bi-person"></i>
                            <input type="text" id="nameInput" placeholder="e.g. Juan Dela Cruz / Maria Santos">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="input-with-icon">
                            <i class="bi bi-telephone"></i>
                            <input type="text" id="phoneInput" placeholder="e.g. +63 917 123 4567">
                        </div>
                    </div>
                </div>

                <!-- ROLE SELECTION -->
                <div class="form-group">
                    <label id="roleLabel">Select Portal Role / POV</label>
                    <div class="input-with-icon">
                        <i class="bi bi-shield-lock"></i>
                        <select id="roleSelect" onchange="updateRoleTheme()">
                            <option value="admin" selected>Admin / Property Manager</option>
                            <option value="owner">Property Owner / Investor</option>
                            <option value="client">Client / Resident Tenant</option>
                        </select>
                    </div>
                </div>

                <!-- EMAIL ADDRESS -->
                <div class="form-group">
                    <label>Email Address <span style="color:var(--danger, #EF4444);">*</span></label>
                    <div class="input-with-icon">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="emailInput" placeholder="name@domain.ph" required>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label>Password <span style="color:var(--danger, #EF4444);">*</span></label>
                    <div class="input-with-icon">
                        <i class="bi bi-key"></i>
                        <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="auth-options" id="authOptionsRow">
                    <label><input type="checkbox" id="rememberMe" checked> Remember this device</label>
                    <a href="#" onclick="alert('Password reset instructions will be sent to your registered email.'); return false;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span id="btnSubmitText">Sign In & Route</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="divider" id="portalLaunchDivider" style="margin:20px 0 14px 0; text-align:center; font-size:11px; color:var(--muted, #64748B);">Quick Portal Access</div>

            <!-- DIRECT PORTAL ROUTING BUTTONS -->
            <div class="demo-roles" id="demoRolesContainer">
                <button class="demo-btn" type="button" onclick="quickLaunchPortal('admin')">
                    <i class="bi bi-speedometer2" style="color:#2563EB;"></i>
                    <span>Admin Command Center (dashboard.html)</span>
                </button>
                <button class="demo-btn" type="button" onclick="quickLaunchPortal('owner')">
                    <i class="bi bi-graph-up-arrow" style="color:#059669;"></i>
                    <span>Owner Portal (owner-dashboard.html)</span>
                </button>
                <button class="demo-btn" type="button" onclick="quickLaunchPortal('client')">
                    <i class="bi bi-house-door" style="color:#D97706;"></i>
                    <span>Tenant Portal (client-dashboard.html)</span>
                </button>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="auth-footer" style="text-align:center; font-size:11px; color:var(--muted, #64748B); padding:16px 0;">
            ARGO v0.5 • PostgreSQL + FastAPI Multi-Tenant Architecture
        </div>
    </div>

    <!-- ROUTING LOGIC & SYSTEM INITIALIZER -->
    <script>
        const DEFAULT_ORG_ID = "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11";
        const API_BASE_URL = (
            window.location.origin.includes('localhost') || 
            window.location.origin.includes('127.0.0.1')
        ) 
            ? 'http://127.0.0.1:8000/api'
            : (window.location.origin.includes('github.io'))
                ? 'https://argo-management-2026.onrender.com/api'
                : '/api';

        const AUTH_API_URL = `${API_BASE_URL}/auth`;
        const USERS_API_URL = `${API_BASE_URL}/users`;

        let currentAuthMode = 'signin';

        window.addEventListener('pageshow', () => {
            clearActiveSession();
        });

        document.addEventListener('DOMContentLoaded', () => {
            clearActiveSession();
            initSystemStorage();
            checkBackendHealth();
            updateRoleTheme();
        });

        function clearActiveSession() {
            const keysToRemove = [
                'argo_session', 'argo_token', 'token', 'access_token',
                'argo_pov', 'user_role', 'role', 'argo_user',
                'tenant_id', 'unit_id', 'property_id', 'owner_id', 'user_email'
            ];
            keysToRemove.forEach(k => localStorage.removeItem(k));
            sessionStorage.clear();
        }

        function initSystemStorage() {
            localStorage.setItem('organization_id', DEFAULT_ORG_ID);
            if (!localStorage.getItem('argo_org_settings')) {
                localStorage.setItem('argo_org_settings', JSON.stringify({
                    orgId: DEFAULT_ORG_ID,
                    orgName: 'ARGO Property Group',
                    currency: 'PHP',
                    pmFee: 10,
                    email: 'support@argoproperty.ph'
                }));
            }
        }

        async function checkBackendHealth() {
            const statusDot = document.getElementById('dbStatusDot');
            const statusText = document.getElementById('dbStatusText');

            try {
                const response = await fetch(`${API_BASE_URL}/health`, { 
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                
                if (response.ok) {
                    const health = await response.json().catch(() => ({}));
                    statusDot.className = 'status-dot online';
                    statusText.textContent = health.database === 'connected'
                        ? 'Neon PostgreSQL & FastAPI Online'
                        : 'FastAPI Gateway Online';
                    return;
                }
            } catch (err) {
                console.warn("Health check notice:", err);
            }

            statusDot.className = 'status-dot offline';
            statusText.textContent = 'Backend Connecting...';
        }

        function switchAuthMode(mode) {
            currentAuthMode = mode;
            const tabSignIn = document.getElementById('tabSignIn');
            const tabRegister = document.getElementById('tabRegister');
            const registerFields = document.getElementById('registerFields');
            const btnSubmitText = document.getElementById('btnSubmitText');
            const authSubtitle = document.getElementById('authSubtitle');
            const authOptionsRow = document.getElementById('authOptionsRow');

            if (mode === 'register') {
                tabRegister.style.borderBottom = '2px solid var(--primary, #2563EB)';
                tabRegister.style.color = 'var(--primary, #2563EB)';
                tabSignIn.style.borderBottom = '2px solid transparent';
                tabSignIn.style.color = 'var(--muted, #64748B)';
                registerFields.style.display = 'block';
                btnSubmitText.textContent = 'Create Account & Proceed';
                authSubtitle.textContent = 'New User Self-Registration';
                if (authOptionsRow) authOptionsRow.style.display = 'none';
            } else {
                tabSignIn.style.borderBottom = '2px solid var(--primary, #2563EB)';
                tabSignIn.style.color = 'var(--primary, #2563EB)';
                tabRegister.style.borderBottom = '2px solid transparent';
                tabRegister.style.color = 'var(--muted, #64748B)';
                registerFields.style.display = 'none';
                btnSubmitText.textContent = 'Sign In & Route';
                authSubtitle.textContent = 'Auth Gateway & Role Router';
                if (authOptionsRow) authOptionsRow.style.display = 'flex';
            }
        }

        function updateRoleTheme() {
            const role = document.getElementById('roleSelect').value;
            const largeLogo = document.getElementById('largeBrandLogo');
            const btnSubmit = document.getElementById('btnSubmit');

            if (!largeLogo || !btnSubmit) return;

            if (role === 'admin') {
                largeLogo.style.background = '#2563EB';
                btnSubmit.style.background = '#2563EB';
            } else if (role === 'owner') {
                largeLogo.style.background = '#059669';
                btnSubmit.style.background = '#059669';
            } else if (role === 'client') {
                largeLogo.style.background = '#D97706';
                btnSubmit.style.background = '#D97706';
            }
        }

        function storeUnifiedSession(token, userObj, role) {
            const normalizedRole = (role || userObj.role || 'admin').toLowerCase().trim();
            const fullName = userObj.name || userObj.full_name || (
                normalizedRole === 'admin' ? 'Property Admin' : 
                normalizedRole === 'owner' ? 'Property Owner' : 'Resident Tenant'
            );
            
            const sessionPayload = {
                token: token,
                role: normalizedRole,
                user: {
                    id: userObj.id || userObj.user_id,
                    email: userObj.email || '',
                    name: fullName,
                    phone: userObj.phone || '',
                    role: normalizedRole,
                    avatar: userObj.avatar || fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'U',
                    avatarBg: normalizedRole === 'admin' ? '#2563EB' : (normalizedRole === 'owner' ? '#059669' : '#D97706'),
                    organization_id: userObj.organization_id || DEFAULT_ORG_ID
                }
            };

            localStorage.setItem('argo_session', JSON.stringify(sessionPayload));
            localStorage.setItem('token', token);
            localStorage.setItem('argo_token', token);
            localStorage.setItem('argo_pov', normalizedRole);
            localStorage.setItem('user_role', normalizedRole.toUpperCase());
            localStorage.setItem('role', normalizedRole);
            localStorage.setItem('argo_user', JSON.stringify(sessionPayload.user));
            localStorage.setItem('user_email', sessionPayload.user.email);
            localStorage.setItem('organization_id', sessionPayload.user.organization_id);
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const selectedRole = document.getElementById('roleSelect').value;
            const name = document.getElementById('nameInput') ? document.getElementById('nameInput').value.trim() : '';
            const phone = document.getElementById('phoneInput') ? document.getElementById('phoneInput').value.trim() : '';
            const btnSubmit = document.getElementById('btnSubmit');

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            if (currentAuthMode === 'register' && !name) {
                alert("Please enter your full legal name to register.");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>Verifying with Neon Database...</span>';

            const endpoint = currentAuthMode === 'register' ? `${AUTH_API_URL}/register` : `${AUTH_API_URL}/login`;
            const payload = currentAuthMode === 'register' 
                ? { 
                    email: email, 
                    password: password, 
                    name: name, 
                    full_name: name,
                    phone: phone, 
                    role: selectedRole,
                    organization_id: DEFAULT_ORG_ID
                  }
                : { 
                    email: email, 
                    password: password 
                  };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    const token = data.access_token || data.token || `live_token_${Date.now()}`;
                    const user = data.user || {
                        id: data.id,
                        email: email,
                        name: name || data.name || email.split('@')[0],
                        phone: phone || data.phone || '',
                        role: data.role || selectedRole,
                        organization_id: data.organization_id || DEFAULT_ORG_ID
                    };
                    
                    storeUnifiedSession(token, user, user.role || selectedRole);
                    redirectByRole(user.role || selectedRole);
                } else {
                    const errorMsg = data.detail || (typeof data === 'string' ? data : 'Authentication request failed.');
                    alert(`⚠️ ${currentAuthMode === 'register' ? 'Registration Failed' : 'Login Failed'}:\n${errorMsg}`);
                }
            } catch (error) {
                console.error("Network or API Error:", error);
                alert("⚠️ Cannot connect to backend server. If using Render, please wait 30 seconds for the instance to wake up and try again.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>${currentAuthMode === 'register' ? 'Create Account & Proceed' : 'Sign In & Route'}</span><i class="bi bi-arrow-right"></i>`;
            }
        }

        function quickLaunchPortal(role) {
            const emailInput = document.getElementById('emailInput').value.trim();
            const token = `live_portal_token_${role}_${Date.now()}`;

            let defaultName = 'System Admin';
            if (role === 'owner') defaultName = 'Property Owner';
            if (role === 'client') defaultName = 'Resident Tenant';

            const quickUser = {
                id: `usr_${role}_direct`,
                name: defaultName,
                email: emailInput || `${role}@argo.ph`,
                phone: '+63 900 000 0000',
                role: role,
                organization_id: DEFAULT_ORG_ID
            };

            storeUnifiedSession(token, quickUser, role);
            redirectByRole(role);
        }

        function redirectByRole(role) {
            const normalized = (role || '').toLowerCase().trim();
            if (['client', 'tenant', 'client_pov'].includes(normalized)) {
                window.location.replace('client-dashboard.html');
            } else if (['owner', 'property_owner', 'investor'].includes(normalized)) {
                window.location.replace('owner-dashboard.html');
            } else {
                window.location.replace('dashboard.html');
            }
        }
    </script>
</body>
</html>
